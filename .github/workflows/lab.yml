name: Lab

on:
  workflow_dispatch:
    inputs:
      share:
        description: Share to search
        default: \\FS1\LabShare
      cloned:
        description: The runner is a cloned copy of the share server
        type: boolean
        default: false
      mapped:
        description: Search through a mapped drive letter
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lab:
    runs-on: [self-hosted, windows, entreelab]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet publish Entree/Entree.csproj -c Release -o out

      - name: Lab checks
        shell: pwsh
        env:
          SHARE: ${{ inputs.share }}
          CLONED: ${{ inputs.cloned }}
          MAPPED: ${{ inputs.mapped }}
        run: ./lab/TestLab.ps1 -Entree out/Entree.exe -Share $env:SHARE -Cloned:($env:CLONED -eq 'true') -Mapped:($env:MAPPED -eq 'true')
