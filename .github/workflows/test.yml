name: Test

on:
  push:
    branches: [main, "dev-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Entree.sln -c Release --logger "console;verbosity=normal"

      - name: Lab scripts parse
        shell: pwsh
        run: |
          $errors = Get-ChildItem lab/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
          }
          if ($errors) { $errors; exit 1 }
